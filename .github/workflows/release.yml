# ---------------------------------------------------------------------------
# me-tric — release pipeline
#
# Pushing a tag starting with `v` builds the desktop bundle for every supported
# platform and publishes the results as a GitHub Release for that tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Three choices here are deliberate.
#
# 1. The tag must equal the packaged version. `tests/me_tric.test.js` already
#    locks Cargo.toml, Cargo.lock, tauri.conf.json and package.json to one
#    value, so comparing the tag against Cargo.toml catches the only mistake
#    that check cannot: tagging v0.2.0 while the binary still reports 0.1.0.
#
# 2. Linux is not built. `bundle.targets` is ["app"] (a macOS-only format),
#    `client/src-tauri/src` has no `target_os = "linux"` branch at all, and the
#    window shaping is ~40 Windows arms plus a patched wry runtime. A platform
#    that has never been compiled would turn this pipeline permanently red for
#    a product nobody can install. Add it once someone builds it by hand.
#
# 3. Bundles are unsigned. No signing identity is configured, so macOS ad-hoc
#    signs and Gatekeeper quarantines the result. The release body says so
#    rather than letting users discover it on first launch.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - "v*"

# Creating and editing a release needs more than the default read-only token.
permissions:
  contents: write

# Two tag pushes must not race to create the same release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Pinned in one place: the README documents this exact CLI build, and a
  # floating @2 would change the bundler behaviour under a released tag.
  TAURI_CLI: "@tauri-apps/cli@2.11.3"
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    name: Verify the tag and the tree
    # The suite is authored on Windows (it normalises CRLF checkouts), so gate
    # the release on the platform it is actually maintained for.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: The tag must equal the packaged version
        shell: bash
        run: |
          version=$(grep -m1 '^version = "' client/src-tauri/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME} package=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${version}"
            exit 1
          fi

      - name: Client behaviour tests
        run: bun test tests/me_tric.test.js

      - name: Frontend assembly still succeeds
        run: bun run build-frontend.js
        working-directory: client

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      # Report every platform's result; `needs:` below already blocks the
      # release if any one of them fails.
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            # The host triple, named explicitly so `rust-targets` is never
            # empty. Naming it also moves cargo's output under target/<triple>/,
            # even though it equals the host — hence the artifact path below.
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - label: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            # An explicit --target moves the output under target/<triple>/.
            artifacts: client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build links both architectures, so both targets
          # must exist before cargo is asked to build either.
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The app crate, the transport crate it path-depends on and the
          # patched wry runtime all build beneath one target directory.
          workspaces: "client/src-tauri -> target"

      # `beforeBuildCommand` would run this anyway, but doing it as its own
      # step means an assembly failure is reported on its own line instead of
      # being buried in the bundler log.
      - name: Assemble the frontend core
        run: bun run build-frontend.js
        working-directory: client

      - name: Build the bundle
        shell: bash
        run: |
          bunx "${TAURI_CLI}" build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"
        working-directory: client

      - uses: actions/upload-artifact@v4
        with:
          name: me-tric-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # merge-multiple flattens every job's output into one directory, which is
      # all `gh release create` needs.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A `-` in the version marks a pre-release (v0.2.0-beta.1).
          extra=()
          case "${GITHUB_REF_NAME}" in
            *-*) extra+=(--prerelease) ;;
          esac

          ls -l artifacts

          # --generate-notes cannot be combined with --notes/--notes-file, so
          # the generated changelog is fetched back in the next step and the
          # signing caveat is prepended to it there.
          #
          # Re-running a failed tag push must converge, so an existing release
          # is updated instead of aborting on "already exists".
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; uploading assets to it"
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber artifacts/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ME Tric ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${extra[@]}" \
              artifacts/*
          fi

      - name: Put the signing caveat above the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(mktemp)
          {
            echo '## 构建产物未签名'
            echo
            echo '- **Windows**：`nsis` 安装包未做 Authenticode 签名，SmartScreen 会提示"未知发布者"。'
            echo '- **macOS**：只有 ad-hoc 签名，首次打开会被 Gatekeeper 拦截。右键 → 打开，'
            echo '  或执行 `xattr -dr com.apple.quarantine "/Applications/ME Tric.app"`。'
            echo
            echo '---'
            echo
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json body -q .body
          } > "${body}"
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file "${body}"

      - name: Summarise the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >> "${GITHUB_STEP_SUMMARY}"
